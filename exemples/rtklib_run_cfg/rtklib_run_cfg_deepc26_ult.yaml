# RTKLIB Processing Configuration Example
# Use with: rtklib_run -y rtklib_run_cfg_ovpf_ult.yaml

# Required parameters
rnx_dir:
  - /home/sakic/IPGP_WORK/PROJECT_OTHERS/2609_DEEPC_LaCiotat/010_DATA/010_GNSS/010_BASE_DEPC_RNX/20Z    # Directory containing RINEX files
  - /home/sakic/IPGP_WORK/PROJECT_OTHERS/2609_DEEPC_LaCiotat/010_DATA/010_GNSS/020_ROVER_INSU_RNX/20Z
cfgfile_generik: /home/sakic/CODES/geodezyx/exemples/rtklib_configfiles/rtknavi_example_deepc26_01a.conf # RTKLIB configuration file
## sites_rovers: two syntaxes are supported:
##   (A) Standard: list of rover names + separate sites_bases list (cartesian product)
##   (B) Pair syntax: each entry is "ROVER,BASE" (explicit pairs; sites_bases is ignored)
## Example of syntax (B):
# sites_rovers:
#   - BOMG00REU,GITG00REU
#   - BORG00REU,B59300REU
## (below uses syntax B)
sites_rovers:  # List of rover stations
  - INSU00FRA
sites_bases:
  - DEPC00FRA  # No pivot base station
out_dir: /home/sakic/IPGP_WORK/PROJECT_OTHERS/2609_DEEPC_LaCiotat/020_RTKLIB_out  # Output directory

# Optional parameters
exp_prefix: deepc26_GRG_RAP                               # Output filename prefix (default: empty)
igs_prods: GRG0OPSRAP                                     # IGS product ID (default: GRG0OPSULT)
tmp_dir: /home/sakic/IPGP_WORK/PROJECT_OTHERS/2609_DEEPC_LaCiotat/029_RTKLIB_tmp/        # Temporary directory (default: <out_dir>/TMP)
prod_dir: /home/sakic/IPGP_WORK/PROJECT_OTHERS/2609_DEEPC_LaCiotat/025_RTKLIB_prods/   # GNSS products directory (default: <tmp_dir>)

# Date range (optional, processes all if not specified)
date_srt: "2 day ago" # Start date (YYYY-MM-DD or YYYY-DDD)
date_end: "1 minute ago"         # End date (YYYY-MM-DD or YYYY-DDD)

# Station coordinates (optional, uses RINEX header if not provided)
xyz_dic:
  DEPC00FRA: [4636607.6572,  455309.5887, 4341522.4271]

# RTKLIB configuration overrides (optional)
posmode: kinematic # Position mode: 0:single,1:dgps,2:kinematic,3:static,4:static-start,5:movingbase,6:fixed,7:ppp-kine,8:ppp-static,9:ppp-fixed
solformat: xyz   # Solution format: llh, xyz, enu, nmea
sateph: precise  # Satellite ephemeris: brdc, precise, brdc+sbas, brdc+ssrapc, brdc+ssrcom

# Processing options
force: False     # Force reprocessing (overwrite existing)
keep_tmp: False  # Clean temporary directory after processing
procs: 1         # Number of parallel workers (default: 4)

# Executable path (optional)
exe_path: /home/sakic/SOFTWARE/RTKLIB_explorer/RTKLIB/app/consapp/rnx2rtkp/gcc/rnx2rtkp   

# Parquet merge options
fast_parquet_merge: False  # If True, only merge newly created parquet files instead of scanning the whole output directory
sample: 5min  # resample points when merging the parquets (e.g., "5min" for 5 minutes, default: None for all points)


