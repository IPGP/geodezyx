# RTKLIB Processing Configuration Example
# Use with: rtklib_run -y rtklib_run_cfg_ovpf_ult.yaml

# Required parameters
rnx_dir:
  - /vol/ovpf/miroir_ovpf/DonneesTemporaires/Geodesy/GNSS/RINEX/15M01S/PF/%Y/%j # Directory containing RINEX files
  - /home/ovsgnss/050_DATA_GNSS/data_centipede_reu/B59300REU
cfgfile_generik: /opt/softs_gnss/geodezyx/exemples/rtklib_configfiles/rtknavi_example_ovpf_01b.conf # RTKLIB configuration file
## sites_rovers: two syntaxes are supported:
##   (A) Standard: list of rover names + separate sites_bases list (cartesian product)
##   (B) Pair syntax: each entry is "ROVER,BASE" (explicit pairs; sites_bases is ignored)
## Example of syntax (B):
# sites_rovers:
#   - BOMG00REU,GITG00REU
#   - BORG00REU,B59300REU
## (below uses syntax B)
sites_rovers:  # List of rover stations
#  - BOMG00REU, GITG00REU  # Explicit pair: BOMG00REU as rover, GITG00REU as base
#  - BORG00REU, GITG00REU  # Explicit pair: BORG00REU as rover, B59300REU as base
#  - CFNG00REU, GITG00REU  # Explicit pair: CFNG00REU as rover, GITG00REU as base
#  - DERG00REU, GITG00REU  # Explicit pair: DERG00REU as rover, GITG00REU as base
#  - DSRG00REU, GITG00REU  # Explicit pair: DSRG00REU as rover, GITG00REU as base
#  - SNEG00REU, GITG00REU  # Explicit pair: SNEG00REU as rover, GITG00REU as base
### new direct pairs, based on virtual pair plot
  - BOMG00REU, BORG00REU
  - BOMG00REU, DERG00REU
  - BOMG00REU, DSRG00REU
  - BOMG00REU, SNEG00REU
  - BORG00REU, DERG00REU
  - BORG00REU, DSRG00REU
  - BORG00REU, SNEG00REU
  - DERG00REU, DSRG00REU
  - DERG00REU, SNEG00REU
  - DSRG00REU, SNEG00REU
### old direct pairs
#  - BOMG00REU, DSRG00REU
#  - DSRG00REU, BOMG00REU
#  - BOMG00REU, SNEG00REU
#  - SNEG00REU, BOMG00REU
#  - SNEG00REU, DSRG00REU
#  - DSRG00REU, SNEG00REU
#  - SNEG00REU, DERG00REU
#  - DERG00REU, SNEG00REU
#  - DERG00REU, DSRG00REU
#  - DSRG00REU, DERG00REU
sites_bases:
  - NONE       # No pivot base station
#  - GITG00REU  # Pivot base station
#  - B59300REU  # Pivot base station
out_dir: /backuped/calcgnss/rtklib_process/OVPF_static-start_FIN_enu  # Output directory

# Optional parameters
exp_prefix: OVPF_static-start_FIN_enu                     # Output filename prefix (default: empty)
igs_prods: GRG0MGXFIN                                     # IGS product ID (default: GRG0OPSULT)
tmp_dir: /backuped/calcgnss/rtklib_process/090_TMP        # Temporary directory (default: <out_dir>/TMP)
prod_dir: /home/ovsgnss/040_PRODS_GNSS/prods_gnss_rtklib  # GNSS products directory (default: <tmp_dir>)

# Date range (optional, processes all if not specified)
date_srt: "2026-300"    # Start date (YYYY-MM-DD or YYYY-DDD)
date_end: " 2026-301"   # End date (YYYY-MM-DD or YYYY-DDD)

# Station coordinates (optional, uses RINEX header if not provided)
xyz_dic:
  GITG00REU: [+3.354343977502337e06, +4.914925760476323e06, -2.294766603476249e06]
  B59300REU: [3364606.0383,  4907503.0340, -2293500.0091]

# RTKLIB configuration overrides (optional)
posmode: static-start  # Position mode: 0:single,1:dgps,2:kinematic,3:static,4:static-start,5:movingbase,6:fixed,7:ppp-kine,8:ppp-static,9:ppp-fixed
solformat: enu   # Solution format: llh, xyz, enu, nmea
sateph: precise  # Satellite ephemeris: brdc, precise, brdc+sbas, brdc+ssrapc, brdc+ssrcom

# Processing options
force: False     # Force reprocessing (overwrite existing)
keep_tmp: False  # Clean temporary directory after processing
procs: 6         # Number of parallel workers (default: 4)

# Executable path (optional)
exe_path: rnx2rtkp
